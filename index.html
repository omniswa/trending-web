<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3NDING – What's going on?</title>
  <meta name="description" content="3NDING is a place where you get information on what's going around. Browse the latest stories.">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1016" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://picsum.photos" crossorigin>
  <link rel="stylesheet" href="css/index.css">
  <script>
    /* Set theme before first paint to avoid a flash */
    (function() {
      try {
        var s = localStorage.getItem('theme');
        var d = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="./" aria-label="3NDING home">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f46e5" />
              <stop offset="1" stop-color="#0d9488" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#g)" />
          <text x="16" y="23" text-anchor="middle" font-size="28" font-weight="bolder" font-family="Arial, sans-serif" fill="white">&nearr;</text>
        </svg>
        3NDING
      </a>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode">
        <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
        </svg>
        <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>
  
  <main class="wrap">
    <section class="hero">
      <h1>What is up?</h1>
      <p>Your daily source of what's going around.</p>
    </section>
    
    <form class="toolbar" id="tools" role="search" novalidate>
      <div class="search" id="searchBox">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <label class="sr" for="q">Search posts</label>
        <input id="q" type="search" placeholder="Search posts" autocomplete="off" enterkeyhint="search" maxlength="100">
        <button class="clear" id="clear" type="button" aria-label="Clear search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <label class="sr" for="sort">Sort posts</label>
      <select class="sort" id="sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="title">Title A–Z</option>
      </select>
    </form>
    
    <p class="count" id="count" tabindex="-1" aria-live="polite"></p>
    <ul class="feed" id="grid" aria-busy="true"></ul>
    <div id="state"></div>
    <nav class="pager" id="pager" aria-label="Pagination" hidden></nav>
    <noscript>
      <div class="state">
        <h2>JavaScript is required</h2>
        <p>Enable JavaScript to browse posts.</p>
      </div>
    </noscript>
  </main>
  
  <footer>
    <div class="wrap foot">
      <section>© <span id="year">2026</span> 3NDING </section>
      <section class="links">
        <a href="#">About</a> |
        <a href="#">Terms</a> |
        <a href="#">Privacy</a>
      </section>
    </div>
  </footer>
  
  <script src="js/index.js"></script>
</body>

</html>
